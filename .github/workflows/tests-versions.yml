name: Run tests for different versions of Kedro and azure-ai-ml
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

# Running tests reads; nothing here touches a pull request. This previously granted
# `pull-requests: write`, which no step used, and left `contents` at none -- checkout
# worked only because the repository is public and clones unauthenticated.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Test ${{ matrix.python-version }} | ${{ matrix.kedro_spec }} | ${{ matrix.azureml_spec }} | mlflow=${{ matrix.with_mlflow }} on ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        kedro_spec: ["kedro>=1.0,<2.0"]
        azureml_spec: ["azure-ai-ml>=1.2,<1.20", "azure-ai-ml>=1.20"]
        with_mlflow: ["False", "True"]
        exclude:
          # azure-ai-ml<1.20 uses typing internals incompatible with Python 3.13
          - python-version: "3.13"
            azureml_spec: "azure-ai-ml>=1.2,<1.20"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install nox
        # renovate: datasource=pypi depName=nox
        run: uv tool install --python-preference only-managed nox==2026.8.17

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install --python-preference only-managed ${{ matrix.python-version }}

      - name: Run versioned tests
        shell: bash
        run: |
          nox -s "test_versions-${{ matrix.python-version }}(with_mlflow=${{ matrix.with_mlflow }}, azureml_spec='${{ matrix.azureml_spec }}', kedro_spec='${{ matrix.kedro_spec }}')"
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 0

  versions-passed:
    name: Versions passed
    if: always()
    needs: [versions]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the version matrix did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::the version-compatibility matrix failed or was cancelled"
          exit 1
      - name: Version matrix passed
        run: echo "All version-compatibility jobs passed or were legitimately skipped."
